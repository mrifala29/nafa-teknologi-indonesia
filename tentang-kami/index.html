<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halaman Dipindahkan - Nafa Teknologi Indonesia</title>

  <!--
    Halaman /tentang-kami/ dipindahkan ke /karir/. Fragmen ("#tim") ikut diteruskan

      rewrite ^/tentang-kami/?$ /karir/ permanent;
  -->
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://nafateknologi.web.id/karir/">

  <noscript>
    <meta http-equiv="refresh" content="0; url=/karir/">
  </noscript>
</head>

<body>
  <p>Halaman ini sudah dipindahkan ke <a href="/karir/">/karir/</a>.</p>
</body>
